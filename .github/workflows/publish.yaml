name: Publish UDS Capability

on:
  workflow_call:

jobs:
  run-build-test:
    uses: ./.github/workflows/build-test.yaml
    permissions:
      id-token: write
      contents: read

  run-airgap-build-test:
    uses: ./.github/workflows/airgap-build-test.yaml
    permissions:
      id-token: write
      contents: read

  publish-uds-package:
    needs: [run-build-test, run-airgap-build-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture:
          - arm64
          - amd64

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.38.0

      - name: Environment setup
        run: |
          echo "MARU_AUTH=\"{\"raw.githubusercontent.com\": \"${{ secrets.GITHUB_TOKEN }}\"}\"" >> "$GITHUB_ENV"
          uds run actions:setup-environment \
          --set GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
        shell: bash

      - name: Download Airgap Package Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: airgap-package-${{ matrix.architecture }}
          path: ./airgap-package

      - name: Download Standard Package Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ matrix.architecture }}
          path: ./standard-package

      - name: Sign, verify, and publish the packages
        shell: bash
        run: |
          signing_identity_regex='^https://github\.com/defenseunicorns/uds-k3d/\.github/workflows/publish\.yaml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'
          packages=(
            ./airgap-package/zarf-package-uds-k3d-${{ matrix.architecture }}-*.tar.zst
            ./standard-package/zarf-package-uds-k3d-${{ matrix.architecture }}-*.tar.zst
          )

          sign_verify_publish() {
            local package="${1}"

            uds zarf package sign "${package}" --keyless --confirm
            test -f "${package}"
            uds zarf package verify "${package}" \
              --certificate-identity-regexp "${signing_identity_regex}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            uds zarf package publish "${package}" oci://ghcr.io/defenseunicorns/packages
          }

          for package in "${packages[@]}"; do
            sign_verify_publish "${package}"
          done
