name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  packages: read
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: uds-release
    steps:
      # Tags created with GITHUB_TOKEN do not trigger tag workflows, so use a
      # GitHub App token for release and tag creation.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create GitHub release and tag
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          skip-github-pull-request: true

      # Keep release PR creation on GITHUB_TOKEN so it retains the existing
      # milestone-triggered CI behavior.
      - name: Create or update release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          skip-github-release: true
